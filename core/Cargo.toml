[package]
name = "dualkey-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared DualKey types: intent, policy, account layout, and canonical encoding constants"
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# Intentionally empty. dualkey-core must stay no_std-friendly and hasher-agnostic.
# SHA-256 is performed by each consumer (sha2 off-chain, sol_sha256 on-chain).

[features]
default = []
std = []

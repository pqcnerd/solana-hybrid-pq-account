[package]
name = "dualkey-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared DualKey types: intent, policy, account layout, and canonical encoding"
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# Optional host hasher only. The on-chain program does NOT enable this feature;
# it hashes the same `canonical_preimage` bytes with the `sol_sha256` syscall.
sha2 = { workspace = true, optional = true }

[features]
default = []
std = []
# Enables `canonical_digest` via the `sha2` crate (host/client use).
sha2 = ["dep:sha2"]

[workspace]
resolver = "2"
members = [
    "core",
    "program",
    "client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["DualKey Contributors"]
repository = "https://github.com/example/solana-hybrid-pq-account"

[workspace.dependencies]
dualkey-core = { path = "core" }
solana-falcon512 = "0.1.2"
solana-program-error = "3.0.1"
pqcrypto-falcon = "0.4"
pqcrypto-traits = "0.3"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[package]
name = "dualkey-program"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "DualKey on-chain program: hybrid Ed25519 + Falcon-512 smart accounts"
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "dualkey_program"

[dependencies]
dualkey-core = { workspace = true }
solana-falcon512 = { workspace = true }
solana-program-error = { workspace = true }

# Minimal Solana program surface for Milestone 0 scaffolding.
# Exact crate versions are pinned via Cargo.lock once resolved.
solana-account-info = "3"
solana-program-entrypoint = "3"
solana-pubkey = "3"
solana-msg = "3"

[dev-dependencies]

[features]
default = []
# Cluster domain separators (Milestone 4+). Only one should be selected for a build.
mainnet = []
devnet = []
localnet = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic"))',
] }

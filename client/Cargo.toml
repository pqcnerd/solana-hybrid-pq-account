[package]
name = "dualkey-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "DualKey off-chain CLI: keygen, dual-scheme signing, and verification"
repository.workspace = true

[lib]
name = "dualkey_client"
path = "src/lib.rs"

[[bin]]
name = "dualkey"
path = "src/main.rs"

[dependencies]
dualkey-core = { workspace = true, features = ["std", "sha2"] }
clap = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

# Falcon-512 keygen + signing (PQClean). NEVER depend on this from `program`.
pqcrypto-falcon = { workspace = true }
pqcrypto-traits = { workspace = true }

# Cross-implementation Falcon verification against the on-chain verifier.
# This is the Milestone 1 interoperability gate.
solana-falcon512 = { workspace = true }

# Off-chain instruction construction and PDA derivation (Milestone 3).
# `curve25519` supplies the software off-curve check that the on-chain
# `sol_try_find_program_address` syscall provides; versions are matched to
# mollusk-svm 0.15 so the test harness shares these exact types.
solana-pubkey = { version = "4.1", features = ["curve25519", "std"] }
solana-instruction = "3.2"
solana-system-interface = "3"
# Ed25519 precompile instruction builder (Milestone 5 HybridAnd client path).
solana-ed25519-program = "3"
solana-sdk-ids = "3"

ed25519-dalek = "2"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# Milestone 2 SBF integration tests.
#
# These live here rather than in `program` so that no Falcon *signer*
# (pqcrypto-falcon) ever enters the program package's dependency graph, not
# even as a dev-dependency. That mirrors the real trust boundary: this crate
# signs off-chain, and the program only verifies. Mollusk loads the compiled
# `target/deploy/dualkey_program.so`, so the program is exercised as a real
# SBF binary rather than as host Rust.
mollusk-svm = { version = "0.15", features = ["precompiles"] }
# Version-matched to mollusk-svm 0.15's own dependencies so the `Instruction`,
# `Account` and `ProgramError` types are identical, not merely similar.
solana-account = "4.3"
solana-program-error = "3.0"
# Legacy transaction serialization for Milestone 8 size measurements.
solana-transaction = { version = "4.1", features = ["serde"] }
solana-signature = "3"
bincode = "1"
# Instruction discriminators, so renumbering the harness updates the tests.
dualkey-program = { path = "../program" }

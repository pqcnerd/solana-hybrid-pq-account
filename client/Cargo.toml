[package]
name = "dualkey-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "DualKey off-chain CLI: keygen, signing, and transaction submission"
repository.workspace = true

[[bin]]
name = "dualkey"
path = "src/main.rs"

[dependencies]
dualkey-core = { workspace = true, features = ["std"] }
clap = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

# Falcon-512 keygen + signing (PQClean). NEVER depend on this from `program`.
pqcrypto-falcon = { workspace = true }
pqcrypto-traits = { workspace = true }

# Ed25519 host signing (Milestone 1). Kept lightweight for Milestone 0 scaffolding.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
